# Alembic configuration for SynthVerify.
#
# Deliberately carries **no database URL**: one connection string is configured
# once, through `SV_DATABASE_URL` (or `--url` on the CLI), so a migration can
# never be run against a database by accident. See `synthverify/migrations/env.py`.
#
# Deployment path: `make migrate`, `python -m synthverify.cli db-upgrade`, or
# `python -m alembic upgrade head` from this directory.

[alembic]
script_location = synthverify/migrations
prepend_sys_path = .
version_path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
